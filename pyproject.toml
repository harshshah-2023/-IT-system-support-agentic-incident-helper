[project]
name = "incident-helper"
version = "1.0.0"
description = "Agentic IT Incident Response Helper: LangGraph agents, dual RAG, guardrails, HITL, evals and an LLM gateway."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-community>=0.4",
  "langchain-text-splitters>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain-openai>=1.0",
  "langchain-anthropic>=1.0",
  "langchain-google-genai>=3.0",
  "langchain-groq>=1.0",
  "langchain-ollama>=1.0",
  "langsmith>=0.4",
  "deepagents>=0.2",
  "faiss-cpu>=1.9",
  "fastembed>=0.7",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "markdown>=3.7",
  "beautifulsoup4>=4.12",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "rich>=13.9",
  "aiosqlite>=0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
incident = "incident_helper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:.*langchain-community.*:DeprecationWarning", "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning"]
addopts = "-q"
markers = ["live: needs a real LLM/LangSmith credential; skipped unless configured"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF043", "RUF059"]
"src/incident_helper/cli.py" = ["E501", "C901"]
"src/incident_helper/static/*" = ["E501"]
